<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><linearGradient id="maroon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#210511"/><stop offset=".55" stop-color="#3C0716"/><stop offset="1" stop-color="#7D1426"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3C0716"/><stop offset=".6" stop-color="#7D1426"/><stop offset="1" stop-color="#BD2F43"/></linearGradient></defs><g font-family="Inter,Arial,sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F6F7FA"/><rect x="0" y="0" width="500" height="900" rx="0" fill="url(#maroon)"/><text x="76" y="180" font-size="38" font-weight="800" fill="#FFFFFF">RMMC ITE</text><text x="76" y="235" font-size="22" font-weight="500" fill="#F9CFD8">Account recovery</text><text x="76" y="305" font-size="16" font-weight="500" fill="#FFFFFF">Contact your department administrator</text><text x="76" y="335" font-size="16" font-weight="500" fill="#FFFFFF">to request a temporary password.</text><rect x="595" y="180" width="722" height="460" rx="18" fill="#FFFFFF" stroke="#E5E7ED" stroke-width="1"/><text x="623" y="218" font-size="19" font-weight="750" fill="#252938">Forgot your password?</text><text x="623" y="241" font-size="12" font-weight="400" fill="#6D7688">User account recovery requires an authorized administrator.</text><text x="643" y="306" font-size="15" font-weight="500" fill="#252938">1. Provide your Student Number or username to the Admin.</text><text x="643" y="360" font-size="15" font-weight="500" fill="#252938">2. Admin searches your account in Settings.</text><text x="643" y="414" font-size="15" font-weight="500" fill="#252938">3. Admin resets the temporary password; first login forces a change.</text><rect x="643" y="495" width="310" height="42" rx="11" fill="#7D1426"/><text x="798.0" y="521.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Back to Login</text></g></svg>