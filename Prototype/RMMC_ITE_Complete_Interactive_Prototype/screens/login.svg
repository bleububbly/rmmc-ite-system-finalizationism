ght="700" fill="#7D1426" text-anchor="middle">Student preview</text><rect x="841" y="621" width="460" height="42" rx="11" fill="#FFFFFF" stroke="#D9DDE5" stroke-width="1"/><text x="1071.0" y="647.0" font-size="13" font-weight="700" fill="#3B4355" text-anchor="middle">Forgot password?</text><text x="845" y="721" font-size="12" font-weight="500" fill="#6D7688">Prototype: pick a role above to preview it.</text></g></svg>