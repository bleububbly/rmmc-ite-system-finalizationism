<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900"><title>Login — RMMC ITE Event and Attendance System</title><defs><filter id="shadow" x="-10%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#101828" flood-opacity="0.045"/></filter><linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#991B1B"/><stop offset="1" stop-color="#D62D35"/></linearGradient></defs><g font-family="Inter, Arial, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F6F7FB"/><rect x="0" y="0" width="670" height="900" rx="0" fill="url(#gradient)"/><circle cx="250" cy="600" r="265" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.17"/><circle cx="360" cy="620" r="260" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.13"/><circle cx="120" cy="90" r="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.13"/><rect x="60" y="64" width="48" height="48" rx="12" fill="#FFFFFF"/><text x="84" y="96" font-size="30" font-weight="800" fill="#991B1B" text-anchor="middle">R</text><text x="124" y="83" font-size="23" font-weight="780" fill="#FFFFFF">RMMC ITE</text><text x="124" y="104" font-size="13" font-weight="400" fill="#FDE8E8">Event &amp; Attendance Management</text><text x="64" y="295" font-size="40" font-weight="800" fill="#FFFFFF">One place for every</text><text x="64" y="351" font-size="40" font-weight="800" fill="#FFFFFF">event and attendance.</text><text x="64" y="405" font-size="18" font-weight="400" fill="#FEE2E2">Manage events, scan student QR codes, track daily</text><text x="64" y="435" font-size="18" font-weight="400" fill="#FEE2E2">attendance and simplify semester clearance.</text><circle cx="82" cy="520" r="22" fill="#B63138"/><text x="82" y="526" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="120" y="527" font-size="17" font-weight="620" fill="#FFFFFF">Fast QR-based check-in</text><circle cx="82" cy="606" r="22" fill="#B63138"/><text x="82" y="612" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text><text x="120" y="613" font-size="17" font-weight="620" fill="#FFFFFF">Morning and afternoon attendance</text><circle cx="82" cy="692" r="22" fill="#B63138"/><text x="82" y="698" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="120" y="699" font-size="17" font-weight="620" fill="#FFFFFF">Fines, payments and clearance</text><rect x="800" y="178" width="520" height="560" rx="16" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1" filter="url(#shadow)"/><text x="845" y="247" font-size="30" font-weight="780" fill="#202536">Welcome back</text><text x="845" y="282" font-size="15" font-weight="400" fill="#667085">Sign in to your RMMC ITE account.</text><text x="845" y="343" font-size="12" font-weight="750" fill="#202536">STUDENT ID / USERNAME</text><rect x="845" y="355" width="430" height="54" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="865" y="388" font-size="14" font-weight="400" fill="#98A2B3">Enter student ID or username</text><text x="845" y="460" font-size="12" font-weight="750" fill="#202536">PASSWORD</text><rect x="845" y="472" width="430" height="54" rx="10" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1"/><text x="865" y="505" font-size="14" font-weight="400" fill="#98A2B3">Enter your password</text><text x="1240" y="505" font-size="12" font-weight="650" fill="#B91C1C" text-anchor="end">Show</text><rect x="845" y="565" width="430" height="54" rx="10" fill="#B91C1C"/><text x="1060" y="600" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sign in</text><text x="1060" y="662" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">Secure access for Admin, Officer and Student</text><text x="1060" y="793" font-size="12" font-weight="400" fill="#98A2B3" text-anchor="middle">Designed for RMMC Institute of Technology</text></g></svg>